<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>6ixtube</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scrollbar-color: #2e2a3f transparent; }
  body { background: #07070c; color: #f4f4f5; font-family: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; min-height: 100dvh; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 18px 16px 90px; }
  .brand { font-size: clamp(34px, 8vw, 52px); font-weight: 900; letter-spacing: -.02em; line-height: 1; }
  .brand .blend { background: linear-gradient(100deg,#f0abfc,#a78bfa,#7dd3fc,#86efac,#fde68a,#fda4af); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sbar { display: flex; gap: 8px; margin: 16px 0 10px; }
  .sbar input { flex: 1; min-width: 0; height: 50px; border-radius: 999px; border: 1px solid rgba(255,255,255,.13); background: #12101f; color: #fff; padding: 0 20px; font-size: 16px; outline: none; }
  .sbar input:focus { border-color: rgba(167,139,250,.6); }
  .sbar button { height: 50px; padding: 0 22px; border-radius: 999px; border: 0; background: #e4e4e7; color: #09090b; font-weight: 800; font-size: 15px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 12px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid rgba(255,255,255,.13); background: #12101f; color: #e4e4e7; border-radius: 999px; padding: 8px 15px; font-size: 13.5px; font-weight: 600; min-height: 38px; }
  .chip.on { background: #e4e4e7; color: #09090b; border-color: #e4e4e7; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px 14px; margin-top: 6px; }
  @media (max-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 14px 10px; } }
  .card { display: block; }
  .thumb { position: relative; border-radius: 14px; overflow: hidden; background: #12101f; aspect-ratio: 16/9; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dur { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.82); color: #fff; font-size: 11.5px; font-weight: 700; padding: 2px 6px; border-radius: 6px; }
  .card .t { font-weight: 700; font-size: 14px; line-height: 1.3; margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .a { color: #9d99ad; font-size: 12.5px; margin-top: 2px; }
  .msg { color: #9d99ad; padding: 34px 0; text-align: center; font-size: 15px; }
  .spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid rgba(255,255,255,.15); border-top-color: #a78bfa; margin: 26px auto; animation: sp 0.8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  /* watch */
  .back { display: inline-flex; align-items: center; gap: 6px; color: #c4b5fd; font-weight: 700; font-size: 14.5px; margin-bottom: 12px; background: none; border: 0; padding: 0; }
  .player { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 16px; overflow: hidden; }
  .player video { width: 100%; height: 100%; display: block; background: #000; }
  .wtitle { font-size: clamp(19px, 4.5vw, 25px); font-weight: 800; line-height: 1.25; margin: 14px 0 4px; }
  .wmeta { color: #9d99ad; font-size: 13.5px; margin-bottom: 12px; }
  .wrow { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 14px; }
  .wbtn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid rgba(255,255,255,.15); background: #12101f; color: #f4f4f5; border-radius: 999px; padding: 9px 16px; font-size: 13.5px; font-weight: 700; min-height: 40px; }
  .wbtn:active { transform: scale(.97); }
  .dcard { background: #0d0b1a; border: 1px solid rgba(255,255,255,.08); border-radius: 16px; padding: 14px 16px; margin: 12px 0; }
  .dcard .dh { font-weight: 800; font-size: 13px; letter-spacing: .05em; color: #c4b5fd; margin-bottom: 6px; }
  .dcard .db { color: #d8d5e5; font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .dcard .db.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .dmore { background: none; border: 0; color: #c4b5fd; font-weight: 700; font-size: 13.5px; padding: 6px 0 0; }
  .relh { font-size: 18px; font-weight: 800; margin: 22px 0 10px; }
  #sentinel { height: 8px; }
</style>
</head>
<body>
<div class="wrap" id="homeView">
  <div class="brand">6ix<span class="blend">tube</span></div>
  <form class="sbar" id="sForm">
    <input id="sQ" type="text" placeholder="search or paste a link…" autocomplete="off">
    <button type="submit">search</button>
  </form>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <div id="feedMsg"></div>
  <div id="sentinel"></div>
</div>

<div class="wrap" id="watchView" hidden>
  <button class="back" id="backBtn" type="button">← back</button>
  <div class="player"><video id="vid" controls playsinline></video></div>
  <div class="wtitle" id="wTitle"></div>
  <div class="wmeta" id="wMeta"></div>
  <div class="wrow">
    <a class="wbtn" id="dlBtn" href="#" target="_blank" rel="noopener" style="display:none">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M4 20h16"/></svg>
      download mp4</a>
    <button class="wbtn" id="retryBtn" type="button" style="display:none">try another route</button>
  </div>
  <div class="dcard" id="sixCard" style="display:none">
    <div class="dh">✦ six's debrief</div>
    <div class="db" id="sixBody"></div>
  </div>
  <div class="dcard" id="descCard" style="display:none">
    <div class="db clamp" id="descBody"></div>
    <button class="dmore" id="descMore" type="button">full description</button>
  </div>
  <div class="relh">up next</div>
  <div class="grid" id="relGrid"></div>
</div>

<script>
'use strict';
/* standalone 6ixtube — no server, talks straight to public piped apis */
var APIS = ['https://api.piped.private.coffee', 'https://pipedapi.kavin.rocks', 'https://pipedapi.adminforge.de'];
var apiBase = null;
var GEMINI_KEY = '';

function esc(s) { return String(s == null ? '' : s).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;').split('"').join('&quot;'); }
function fmtViews(n) { n = +n || 0; if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'B'; if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M'; if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K'; return '' + n; }
function fmtDur(s) { s = +s || 0; if (!s) return ''; var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); }
function vidId(it) { var u = String((it && it.url) || ''); var m = u.match(/[?&]v=([A-Za-z0-9_-]{6,})/); if (m) return m[1]; if (/^[A-Za-z0-9_-]{11}$/.test(u)) return u; return ''; }

async function api(path) {
  var order = apiBase ? [apiBase].concat(APIS.filter(function (b) { return b !== apiBase; })) : APIS;
  var lastErr = null;
  for (var i = 0; i < order.length; i++) {
    try {
      var ctl = new AbortController(); var to = setTimeout(function () { ctl.abort(); }, 12000);
      var r = await fetch(order[i] + path, { signal: ctl.signal });
      clearTimeout(to);
      if (!r.ok) throw new Error('http ' + r.status);
      var j = await r.json();
      apiBase = order[i];
      return j;
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('all routes down');
}

var CATS = [['trending', ''], ['gaming', 'gaming'], ['music', 'music'], ['funny', 'funny videos'], ['sports', 'sports highlights'], ['tech', 'tech review'], ['vlogs', 'vlog'], ['podcasts', 'podcast']];
var state = { mode: 'home', cat: '', q: '', next: null, busy: false, seen: {} };

var chipsEl = document.getElementById('chips');
chipsEl.innerHTML = CATS.map(function (c, i) { return '<button type="button" class="chip' + (i === 0 ? ' on' : '') + '" data-i="' + i + '">' + esc(c[0]) + '</button>'; }).join('');
chipsEl.addEventListener('click', function (e) {
  var b = e.target.closest('.chip'); if (!b) return;
  chipsEl.querySelectorAll('.chip').forEach(function (x) { x.classList.toggle('on', x === b); });
  var c = CATS[+b.getAttribute('data-i')];
  if (c[0] === 'trending') loadHome(); else loadSearch(c[1]);
});

function cardHtml(it) {
  var id = vidId(it); if (!id) return '';
  return '<a class="card" href="#" data-v="' + id + '"><div class="thumb"><img loading="lazy" src="' + esc(it.thumbnail || ('https://i.ytimg.com/vi/' + id + '/hqdefault.jpg')) + '" alt="">' + (it.duration ? '<span class="dur">' + fmtDur(it.duration) + '</span>' : '') + '</div><div class="t">' + esc(it.title || '') + '</div><div class="a">' + esc(it.uploaderName || '') + (it.views ? ' · ' + fmtViews(it.views) + ' views' : '') + '</div></a>';
}
function renderItems(items, append) {
  var grid = document.getElementById('grid');
  var html = '';
  (items || []).forEach(function (it) {
    var id = vidId(it); if (!id || state.seen[id]) return;
    state.seen[id] = 1; html += cardHtml(it);
  });
  if (append) grid.insertAdjacentHTML('beforeend', html); else grid.innerHTML = html;
}
function setMsg(html) { document.getElementById('feedMsg').innerHTML = html; }
function spin() { setMsg('<div class="spin"></div>'); }

async function loadHome() {
  state.mode = 'home'; state.next = null; state.seen = {}; spin();
  try {
    var j = await api('/trending?region=US');
    renderItems(j, false);
    setMsg('');
  } catch (e) { setMsg('<div class="msg">couldn\'t reach any route rn — check ur connection n retry</div>'); }
}
async function loadSearch(q) {
  state.mode = 'search'; state.q = q; state.next = null; state.seen = {}; spin();
  try {
    var j = await api('/search?q=' + encodeURIComponent(q) + '&filter=videos');
    renderItems(j.items || [], false);
    state.next = j.nextpage || null;
    setMsg(state.seen && !Object.keys(state.seen).length ? '<div class="msg">nothing found for that</div>' : '');
  } catch (e) { setMsg('<div class="msg">search route is down rn — try again in a sec</div>'); }
}
async function loadMore() {
  if (state.busy || !state.next || state.mode !== 'search') return;
  state.busy = true;
  try {
    var j = await api('/nextpage/search?nextpage=' + encodeURIComponent(state.next) + '&q=' + encodeURIComponent(state.q) + '&filter=videos');
    renderItems(j.items || [], true);
    state.next = j.nextpage || null;
  } catch (e) { /* keep what we have */ }
  state.busy = false;
}
new IntersectionObserver(function (es) { if (es[0].isIntersecting) loadMore(); }, { rootMargin: '700px' }).observe(document.getElementById('sentinel'));

function parseLink(v) {
  v = String(v || '').trim();
  var m = v.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  if (/^[A-Za-z0-9_-]{11}$/.test(v)) return v;
  return '';
}
document.getElementById('sForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var v = document.getElementById('sQ').value.trim();
  if (!v) return;
  var id = parseLink(v);
  if (id) openWatch(id); else loadSearch(v);
});
document.getElementById('grid').addEventListener('click', function (e) {
  var c = e.target.closest('[data-v]'); if (!c) return;
  e.preventDefault(); openWatch(c.getAttribute('data-v'));
});
document.getElementById('relGrid').addEventListener('click', function (e) {
  var c = e.target.closest('[data-v]'); if (!c) return;
  e.preventDefault(); openWatch(c.getAttribute('data-v'));
});
document.getElementById('backBtn').addEventListener('click', function () {
  var v = document.getElementById('vid'); v.pause(); v.removeAttribute('src'); v.load();
  document.getElementById('watchView').hidden = true;
  document.getElementById('homeView').hidden = false;
  window.scrollTo(0, 0);
});

/* ---------- watch ---------- */
var streamTry = 0;
async function openWatch(id) {
  document.getElementById('homeView').hidden = true;
  var wv = document.getElementById('watchView'); wv.hidden = false;
  window.scrollTo(0, 0);
  var vid = document.getElementById('vid');
  vid.removeAttribute('src'); vid.load();
  document.getElementById('wTitle').textContent = 'loading…';
  document.getElementById('wMeta').textContent = '';
  document.getElementById('sixCard').style.display = 'none';
  document.getElementById('descCard').style.display = 'none';
  document.getElementById('dlBtn').style.display = 'none';
  document.getElementById('retryBtn').style.display = 'none';
  document.getElementById('relGrid').innerHTML = '';
  streamTry = 0;
  await playFrom(id, 0);
}
async function playFrom(id, which) {
  var vid = document.getElementById('vid');
  try {
    var j = await api('/streams/' + id);
    document.getElementById('wTitle').textContent = j.title || '';
    document.getElementById('wMeta').textContent = (j.uploader || '') + (j.views ? ' · ' + fmtViews(j.views) + ' views' : '');
    var streams = (j.videoStreams || []).filter(function (s) { return !s.videoOnly; });
    streams.sort(function (a, b) { return (parseInt(b.quality) || 0) - (parseInt(a.quality) || 0); });
    var pick = streams[which] || streams[0];
    if (!pick) throw new Error('no muxed stream');
    vid.src = pick.url;
    vid.play().catch(function () {});
    var dl = document.getElementById('dlBtn');
    dl.href = pick.url; dl.style.display = '';
    var rb = document.getElementById('retryBtn');
    rb.style.display = streams.length > 1 ? '' : 'none';
    rb.onclick = function () { streamTry++; playFrom(id, streamTry % streams.length); };
    var desc = String(j.description || '').trim();
    if (desc) {
      var db = document.getElementById('descBody');
      db.textContent = desc; db.classList.add('clamp');
      document.getElementById('descCard').style.display = '';
      var dm = document.getElementById('descMore');
      dm.textContent = 'full description';
      dm.onclick = function () {
        var clamped = db.classList.toggle('clamp');
        dm.textContent = clamped ? 'full description' : 'show less';
      };
    }
    var rel = (j.relatedStreams || []).map(function (it) { return cardHtml(it); }).join('');
    document.getElementById('relGrid').innerHTML = rel;
    sixDebrief(j.title || '', j.uploader || '');
  } catch (e) {
    document.getElementById('wTitle').textContent = 'this one won\'t play from here';
    document.getElementById('wMeta').textContent = 'youtube said no on every route we got — some videos just wall it. try another one.';
  }
}
async function sixDebrief(title, channel) {
  if (!GEMINI_KEY) return;
  try {
    var prompt = 'You are Six: a washed, perpetually half-drunk internet uncle (divorced twice, banned from two bars and a church picnic, owes his cousin $40 since 2019). Give a funny 2-3 sentence debrief of this youtube video based only on its title and channel. Talk about the video like you watched it at the bar. Lowercase, bar-stool one-liner energy, mild profanity ok. Every sentence must end complete — no trailing off. Title: "' + title + '" Channel: "' + channel + '"';
    var ctl = new AbortController(); var to = setTimeout(function () { ctl.abort(); }, 20000);
    var r = await fetch('https://generativelanguage.googleapis.com/v1beta/openai/chat/completions', {
      method: 'POST', signal: ctl.signal,
      headers: { 'Authorization': 'Bearer ' + GEMINI_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'gemini-flash-latest', messages: [{ role: 'user', content: prompt }], max_tokens: 600 })
    });
    clearTimeout(to);
    if (!r.ok) return;
    var j = await r.json();
    var txt = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
    if (!txt) return;
    document.getElementById('sixBody').textContent = String(txt).trim();
    document.getElementById('sixCard').style.display = '';
  } catch (e) { /* debrief is decoration — stay silent if it fails */ }
}

loadHome();
</script>
</body>
</html>
